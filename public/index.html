<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>StreamingCommunity Web</title>

  <!-- PWA & MOBILE METADATA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StreamingCommunity">
  <meta name="theme-color" content="#09090b">
  
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    :root {
      --bg-main: #09090b;
      --bg-surface: #121217;
      --bg-card: #181820;
      --bg-hover: #22222e;
      --accent: #e50914;
      --accent-glow: rgba(229, 9, 20, 0.4);
      --accent-indigo: #6366f1;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --border: rgba(255, 255, 255, 0.08);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-family);
      overflow-x: hidden;
      min-height: 100vh;
      padding-bottom: 80px; /* Space for floating bottom navbar */
      -webkit-font-smoothing: antialiased;
    }

    /* TOP HEADER */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(9, 9, 11, 0.9);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .brand-badge {
      background: linear-gradient(135deg, #e50914, #ff3b30);
      color: #fff;
      font-weight: 900;
      font-size: 0.82rem;
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 800;
      background: linear-gradient(to right, #fff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }

    .header-center {
      flex: 1;
      max-width: 480px;
      min-width: 140px;
    }

    .search-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 34px 8px 36px;
      border-radius: 999px;
      font-size: 0.88rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: rgba(255, 255, 255, 0.35);
      background: var(--bg-surface);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.08);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      pointer-events: none;
    }

    .search-clear-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: #fff;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .search-clear-btn.hidden {
      display: none;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-header-random {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: #fff;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-header-random:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    @media (max-width: 600px) {
      .brand-title {
        display: none;
      }
      .btn-header-random span {
        display: none;
      }
      .btn-header-random {
        padding: 7px 10px;
      }
      .app-header {
        padding: 8px 12px;
        gap: 8px;
      }
    }

    /* MAIN CONTENT */
    .main-container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 16px;
    }

    /* HERO BANNER */
    .hero-banner {
      position: relative;
      width: 100%;
      height: 380px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: 28px;
      display: flex;
      align-items: flex-end;
      padding: 30px;
      border: 1px solid var(--border);
      background-size: cover;
      background-position: center top;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
      transition: background-image 0.4s ease;
    }

    .hero-backdrop-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, #09090b 0%, rgba(9, 9, 11, 0.65) 55%, rgba(9, 9, 11, 0.25) 100%);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 680px;
    }

    .hero-tag {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: var(--radius-sm);
      margin-bottom: 10px;
    }

    .hero-title {
      font-size: 2.2rem;
      font-weight: 900;
      margin-bottom: 8px;
      line-height: 1.15;
    }

    .hero-plot {
      font-size: 0.92rem;
      color: #cbd5e1;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 18px;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    @media (max-width: 768px) {
      .hero-banner {
        height: 260px;
        padding: 18px;
      }
      .hero-title {
        font-size: 1.4rem;
      }
      .hero-plot {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        font-size: 0.85rem;
      }
    }

    /* BUTTONS */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-weight: 700;
      font-size: 0.88rem;
      padding: 10px 18px;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-primary {
      background: #fff;
      color: #000;
    }

    .btn-primary:hover {
      background: #e2e8f0;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    .btn-vix {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }

    .btn-vix:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    /* MEDIA GRIDS */
    .section-title {
      font-size: 1.3rem;
      font-weight: 800;
      margin: 24px 0 14px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }

    @media (max-width: 600px) {
      .media-grid {
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 10px;
      }
    }

    .media-card {
      position: relative;
      background: var(--bg-card);
      border-radius: var(--radius-md);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.22s ease;
      border: 1px solid var(--border);
    }

    .media-card:hover {
      transform: translateY(-4px) scale(1.02);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.6);
    }

    .card-poster-wrap {
      position: relative;
      width: 100%;
      padding-top: 146%;
      background: #181820;
      overflow: hidden;
    }

    .card-poster {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(8px);
      padding: 2px 7px;
      border-radius: var(--radius-sm);
      font-size: 0.7rem;
      font-weight: 800;
      color: #fff;
    }

    .card-info {
      padding: 8px 10px;
    }

    .card-title {
      font-size: 0.86rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
    }

    .card-meta {
      font-size: 0.72rem;
      color: var(--text-dim);
      margin-top: 3px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* DETAILS MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.hidden {
      display: none;
    }

    .modal-card {
      background: #131318;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 880px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
      position: relative;
    }

    .modal-close-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .modal-layout {
      display: flex;
      gap: 22px;
      padding: 24px;
    }

    @media (max-width: 700px) {
      .modal-layout {
        flex-direction: column;
        padding: 18px;
      }
      .modal-poster {
        width: 160px !important;
        height: 230px !important;
        margin: 0 auto;
      }
    }

    .modal-poster {
      width: 220px;
      height: 320px;
      object-fit: cover;
      border-radius: var(--radius-md);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.7);
      flex-shrink: 0;
    }

    .modal-details {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .modal-title {
      font-size: 1.6rem;
      font-weight: 900;
      margin-bottom: 4px;
    }

    .modal-plot {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 16px;
      max-height: 120px;
      overflow-y: auto;
    }

    .modal-options-title {
      font-size: 0.78rem;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .modal-actions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    /* SEASONS & EPISODES */
    .seasons-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 10px;
    }

    .season-pill {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .season-pill.active {
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    .episodes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 8px;
      max-height: 160px;
      overflow-y: auto;
      margin-top: 6px;
      padding: 4px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: var(--radius-sm);
    }

    .episode-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: #fff;
      padding: 7px 8px;
      border-radius: var(--radius-sm);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .episode-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .episode-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* PLAYER OVERLAY */
    .player-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: #000;
      display: flex;
      flex-direction: column;
    }

    .player-overlay.hidden {
      display: none;
    }

    .player-top-bar {
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.85) 0%, transparent 100%);
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
    }

    .player-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .player-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    /* FLOATING BOTTOM NAVBAR */
    .bottom-navbar {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 90;
      background: rgba(20, 20, 26, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
    }

    .nav-item {
      background: transparent;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-item:hover, .nav-item.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    .nav-item svg {
      width: 18px;
      height: 18px;
    }

    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(24, 24, 31, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #fff;
      padding: 9px 20px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.6);
      z-index: 300;
      pointer-events: none;
      backdrop-filter: blur(12px);
      transition: all 0.25s ease;
    }

    .toast.hidden {
      opacity: 0;
      transform: translate(-50%, 15px);
    }
  </style>
</head>
<body>

  <!-- TOP APP HEADER -->
  <header class="app-header">
    <div class="brand-section" id="btn-brand-home">
      <div class="brand-badge">SC</div>
      <h1 class="brand-title">StreamingCommunity</h1>
    </div>

    <div class="header-center">
      <div class="search-wrapper">
        <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="main-search-input" class="search-input" placeholder="Cerca film, serie..." autocomplete="off">
        <button id="search-clear-btn" class="search-clear-btn hidden">&times;</button>
      </div>
    </div>

    <div class="header-right">
      <button id="btn-header-random" class="btn-header-random" title="Scegli un film casuale">
        <span>🎲</span>
        <span>Casuale</span>
      </button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="main-container">
    <!-- HERO FEATURED SECTION -->
    <div id="hero-banner" class="hero-banner">
      <div class="hero-backdrop-overlay"></div>
      <div class="hero-content">
        <span class="hero-tag">In Primo Piano</span>
        <h2 id="hero-title" class="hero-title">Caricamento catalogo...</h2>
        <p id="hero-plot" class="hero-plot">Connessione ai server di streaming in corso...</p>
        <div class="hero-actions">
          <button id="btn-hero-player" class="btn btn-primary">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            📱 Lettore Nativo (Android / iOS)
          </button>
          <button id="btn-hero-vix" class="btn btn-vix">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
            Apri Vixcloud
          </button>
        </div>
      </div>
    </div>

    <!-- CATALOG GRID SECTION -->
    <div class="section-title">
      <span id="grid-section-heading">🔥 Film & Serie TV in Evidenza</span>
    </div>
    <div id="catalog-grid" class="media-grid"></div>
  </main>

  <!-- MOVIE / SERIES DETAILS MODAL -->
  <div id="details-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <button id="btn-close-details" class="modal-close-btn">&times;</button>
      <div class="modal-layout">
        <img id="detail-poster" class="modal-poster" src="" alt="Poster">
        <div class="modal-details">
          <h2 id="detail-title" class="modal-title">Titolo</h2>
          <div id="detail-meta" style="font-size: 0.82rem; color: var(--text-dim); margin-bottom: 10px;">Anno: 2024 • Film / Serie</div>
          <p id="detail-plot" class="modal-plot">Caricamento dettagli...</p>

          <!-- SEASONS & EPISODES (FOR SERIES) -->
          <div id="seasons-container" style="display:none; margin-bottom: 14px;">
            <div class="modal-options-title">Seleziona Stagione:</div>
            <div id="seasons-tabs" class="seasons-scroll"></div>
            <div class="modal-options-title" id="episodes-header-title">Episodi:</div>
            <div id="episodes-grid" class="episodes-grid"></div>
          </div>

          <div class="modal-options-title">Opzioni di Riproduzione:</div>
          <div class="modal-actions-row">
            <!-- OPTION 1: NATIVE SYSTEM PLAYER (IOS AVPLAYER / ANDROID INTENT) -->
            <button id="btn-modal-player-open" class="btn btn-primary">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
              📱 Lettore Nativo Dispositivo (iOS / Android)
            </button>

            <!-- OPTION 2: ORIGINAL SIGNED VIXCLOUD PLAYLIST LINK -->
            <button id="btn-modal-vix-open" class="btn btn-vix">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
              Apri Link Vixcloud
            </button>

            <!-- OPTION 3: OPEN IN EXTERNAL APP (IPAD/MOBILE VLC, INFUSE) -->
            <button id="btn-modal-external" class="btn btn-secondary" title="Apri in VLC / Infuse">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              Apri in VLC
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- FULLSCREEN VIDEO PLAYER MODAL -->
  <div id="player-modal" class="player-overlay hidden">
    <div class="player-top-bar">
      <button id="btn-player-back" class="btn btn-secondary" style="padding: 7px 14px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span>Chiudi</span>
      </button>
      <span id="player-active-title" style="font-weight: 700; font-size: 0.95rem; color: #fff; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%;">Riproduzione</span>
      <button id="btn-player-vix-direct" class="btn btn-vix" style="padding: 7px 12px; font-size: 0.8rem;">
        Vixcloud
      </button>
    </div>

    <video id="web-video" class="player-video" controls playsinline webkit-playsinline x-webkit-airplay="allow"></video>
    <iframe id="web-iframe" class="player-iframe hidden" allowfullscreen allow="autoplay; fullscreen; picture-in-picture"></iframe>
  </div>

  <!-- FLOATING BOTTOM NAVBAR -->
  <nav class="bottom-navbar">
    <button class="nav-item active" id="nav-home">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Home</span>
    </button>
    <button class="nav-item" id="nav-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <span>Cerca</span>
    </button>
    <button class="nav-item" id="nav-random">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
      <span>Casuale</span>
    </button>
    <button class="nav-item" id="nav-saved">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      <span>Preferiti</span>
    </button>
  </nav>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="toast hidden">Notifica</div>

  <script>
    (function () {
      let loadedCatalog = [];
      let currentActiveItem = null;
      let currentHls = null;
      let savedFavorites = JSON.parse(localStorage.getItem('sc_favs') || '[]');

      const catalogGrid = document.getElementById('catalog-grid');
      const mainSearchInput = document.getElementById('main-search-input');
      const searchClearBtn = document.getElementById('search-clear-btn');
      const heroBanner = document.getElementById('hero-banner');
      const heroTitle = document.getElementById('hero-title');
      const heroPlot = document.getElementById('hero-plot');
      const btnHeroVix = document.getElementById('btn-hero-vix');
      const btnHeroPlayer = document.getElementById('btn-hero-player');
      const detailsModal = document.getElementById('details-modal');
      const btnCloseDetails = document.getElementById('btn-close-details');
      const detailPoster = document.getElementById('detail-poster');
      const detailTitle = document.getElementById('detail-title');
      const detailMeta = document.getElementById('detail-meta');
      const detailPlot = document.getElementById('detail-plot');
      const seasonsContainer = document.getElementById('seasons-container');
      const seasonsTabs = document.getElementById('seasons-tabs');
      const episodesGrid = document.getElementById('episodes-grid');
      const btnModalVixOpen = document.getElementById('btn-modal-vix-open');
      const btnModalPlayerOpen = document.getElementById('btn-modal-player-open');
      const btnModalExternal = document.getElementById('btn-modal-external');
      const playerModal = document.getElementById('player-modal');
      const btnPlayerBack = document.getElementById('btn-player-back');
      const playerActiveTitle = document.getElementById('player-active-title');
      const btnPlayerVixDirect = document.getElementById('btn-player-vix-direct');
      const webVideo = document.getElementById('web-video');
      const webIframe = document.getElementById('web-iframe');
      const toast = document.getElementById('toast');
      const btnBrandHome = document.getElementById('btn-brand-home');
      const btnHeaderRandom = document.getElementById('btn-header-random');
      const navHome = document.getElementById('nav-home');
      const navSearch = document.getElementById('nav-search');
      const navRandom = document.getElementById('nav-random');
      const navSaved = document.getElementById('nav-saved');
      const gridSectionHeading = document.getElementById('grid-section-heading');

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.remove('hidden');
        setTimeout(() => toast.classList.add('hidden'), 2800);
      }

      // LOAD HOME CATALOG
      async function loadHome() {
        try {
          const res = await fetch('/api/sc/home');
          const data = await res.json();
          if (data.success && data.sliders && data.sliders.length > 0) {
            let titles = [];
            data.sliders.forEach(s => {
              (s.titles || []).forEach(t => {
                if (!titles.some(x => x.id === t.id)) titles.push(t);
              });
            });

            loadedCatalog = titles;
            if (loadedCatalog.length > 0) {
              updateHero(loadedCatalog[0]);
              renderCards(loadedCatalog);
            }
          }
        } catch (e) {
          showToast('Connessione al catalogo fallita');
        }
      }

      function updateHero(item) {
        currentActiveItem = item;
        heroBanner.style.backgroundImage = `url('${item.backdrop || item.poster}')`;
        heroTitle.textContent = item.name;
        heroPlot.textContent = item.plot || 'Nessuna trama disponibile.';
      }

      function renderCards(list) {
        catalogGrid.innerHTML = '';
        if (!list || list.length === 0) {
          catalogGrid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-dim); padding: 40px;">Nessun titolo trovato.</div>';
          return;
        }

        list.forEach(item => {
          const card = document.createElement('div');
          card.className = 'media-card';
          card.innerHTML = `
            <div class="card-poster-wrap">
              <img class="card-poster" src="${item.poster || 'https://via.placeholder.com/300x450'}" alt="${item.name}" loading="lazy">
              <div class="card-badge">${item.type === 'tv' ? 'Serie TV' : 'Film'}</div>
            </div>
            <div class="card-info">
              <div class="card-title">${item.name}</div>
              <div class="card-meta">
                <span>${item.release_date || ''}</span>
                <span style="color: #4ade80;">HD 1080p</span>
              </div>
            </div>
          `;
          card.onclick = () => openDetails(item);
          catalogGrid.appendChild(card);
        });
      }

      // DETAILS MODAL WITH SEASONS & EPISODES
      async function openDetails(item) {
        currentActiveItem = item;
        detailPoster.src = item.poster || '';
        detailTitle.textContent = item.name;
        detailMeta.textContent = `Anno: ${item.release_date || '2024'} • ${item.type === 'tv' ? 'Serie TV' : 'Film'}`;
        detailPlot.textContent = item.plot || 'Caricamento dettagli in corso...';
        seasonsContainer.style.display = 'none';
        detailsModal.classList.remove('hidden');

        try {
          const res = await fetch(`/api/sc/title/${item.id}?slug=${encodeURIComponent(item.slug || '')}`);
          const data = await res.json();
          if (data.success && data.title) {
            const t = data.title;
            if (t.plot) detailPlot.textContent = t.plot;
            
            // Check if series with seasons
            if (t.seasons && t.seasons.length > 0) {
              seasonsContainer.style.display = 'block';
              seasonsTabs.innerHTML = '';

              t.seasons.forEach((s, idx) => {
                const pill = document.createElement('button');
                pill.className = `season-pill ${idx === 0 ? 'active' : ''}`;
                pill.textContent = `Stagione ${s.number}`;
                pill.onclick = () => {
                  seasonsTabs.querySelectorAll('.season-pill').forEach(p => p.classList.remove('active'));
                  pill.classList.add('active');
                  loadSeasonEpisodes(item, s.number);
                };
                seasonsTabs.appendChild(pill);
              });

              // If initial episodes already provided in response
              if (t.episodes && t.episodes.length > 0) {
                renderEpisodes(item, t.episodes, t.current_season || 1);
              } else {
                loadSeasonEpisodes(item, t.seasons[0].number);
              }
            }
          }
        } catch (e) {}
      }

      async function loadSeasonEpisodes(item, seasonNum) {
        episodesGrid.innerHTML = '<div style="grid-column:1/-1; color:var(--text-dim); text-align:center; padding:10px;">Caricamento episodi...</div>';
        try {
          const res = await fetch(`/api/sc/season/${item.id}/${seasonNum}?slug=${encodeURIComponent(item.slug || '')}`);
          const data = await res.json();
          if (data.success && data.episodes && data.episodes.length > 0) {
            renderEpisodes(item, data.episodes, seasonNum);
          } else {
            episodesGrid.innerHTML = '<div style="grid-column:1/-1; color:var(--text-dim); text-align:center; padding:10px;">Nessun episodio trovato.</div>';
          }
        } catch (e) {
          episodesGrid.innerHTML = '<div style="grid-column:1/-1; color:var(--text-dim); text-align:center; padding:10px;">Errore nel caricamento episodi.</div>';
        }
      }

      function renderEpisodes(item, episodes, seasonNum) {
        episodesGrid.innerHTML = '';
        episodes.forEach(ep => {
          const epBtn = document.createElement('button');
          epBtn.className = 'episode-btn';
          epBtn.textContent = `Ep. ${ep.number} - ${ep.name || 'Episodio'}`;
          epBtn.onclick = () => {
            episodesGrid.querySelectorAll('.episode-btn').forEach(b => b.classList.remove('active'));
            epBtn.classList.add('active');
            item.current_watch_url = ep.watch_url;
            item.current_ep_title = `S${seasonNum}E${ep.number} - ${ep.name || 'Episodio'}`;
            showToast(`Selezionato Ep. ${ep.number}: premi Riproduci`);
          };
          episodesGrid.appendChild(epBtn);
        });
      }

      function closeDetails() {
        detailsModal.classList.add('hidden');
      }

      btnCloseDetails.onclick = closeDetails;
      detailsModal.onclick = (e) => { if (e.target === detailsModal) closeDetails(); };

      // RESOLVE STREAM
      async function resolveStream(item) {
        showToast("Risoluzione flusso Vixcloud...");
        try {
          const res = await fetch('/api/vixcloud/extract', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              url: item.current_watch_url,
              titleId: item.id
            })
          });
          const data = await res.json();
          return data.master_m3u8 || data.vix_url || data.embed_url || '';
        } catch (e) {
          return '';
        }
      }

      // PLAY VIDEO (NATIVE INTENT FOR ANDROID, AVPLAYER FOR IOS)
      async function playVideo(item) {
        const target = item || currentActiveItem;
        const isAndroid = /Android/i.test(navigator.userAgent);
        const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

        const streamUrl = await resolveStream(target);
        if (!streamUrl) {
          showToast("Errore nella risoluzione del flusso video.");
          return;
        }

        // 1. ANDROID NATIVE SYSTEM PLAYER INTENT
        if (isAndroid && streamUrl.includes('.m3u8')) {
          const cleanUrl = streamUrl.replace(/^https?:\/\//, '');
          const androidIntentUrl = `intent://${cleanUrl}#Intent;scheme=https;type=video/*;action=android.intent.action.VIEW;end;`;
          showToast("Apertura nel lettore nativo Android...");
          window.location.href = androidIntentUrl;
          return;
        }

        // 2. IOS / IPADOS AVPLAYER NATIVE FULLSCREEN
        if (isIOS && streamUrl.includes('.m3u8')) {
          closeDetails();
          playerActiveTitle.textContent = target.current_ep_title ? `${target.name} - ${target.current_ep_title}` : target.name;
          playerModal.classList.remove('hidden');

          webIframe.classList.add('hidden');
          webVideo.classList.remove('hidden');
          webVideo.src = streamUrl;

          try {
            await webVideo.play();
            if (webVideo.webkitEnterFullscreen) {
              webVideo.webkitEnterFullscreen();
            } else if (webVideo.requestFullscreen) {
              webVideo.requestFullscreen();
            }
          } catch (e) {}
          return;
        }

        // 3. DESKTOP / HTML5 BROWSER PLAYER
        closeDetails();
        playerActiveTitle.textContent = target.current_ep_title ? `${target.name} - ${target.current_ep_title}` : target.name;
        playerModal.classList.remove('hidden');

        if (streamUrl.includes('.m3u8')) {
          webIframe.classList.add('hidden');
          webVideo.classList.remove('hidden');

          if (webVideo.canPlayType('application/vnd.apple.mpegurl')) {
            webVideo.src = streamUrl;
            webVideo.play().catch(() => {});
          } else if (Hls.isSupported()) {
            if (currentHls) currentHls.destroy();
            currentHls = new Hls();
            currentHls.loadSource(streamUrl);
            currentHls.attachMedia(webVideo);
            currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
              webVideo.play().catch(() => {});
            });
          }
        } else {
          webVideo.classList.add('hidden');
          webVideo.pause();
          webIframe.classList.remove('hidden');
          webIframe.src = streamUrl;
        }
      }

      btnModalPlayerOpen.onclick = () => playVideo(currentActiveItem);
      btnHeroPlayer.onclick = () => playVideo(currentActiveItem);

      // OPEN VIXCLOUD DIRECT LINK
      async function openVixDirect(item) {
        const target = item || currentActiveItem;
        const streamUrl = await resolveStream(target);
        if (streamUrl) {
          window.open(streamUrl, '_blank');
          showToast("Apertura link Vixcloud...");
        }
      }

      btnModalVixOpen.onclick = () => openVixDirect(currentActiveItem);
      btnHeroVix.onclick = () => openVixDirect(currentActiveItem);
      btnPlayerVixDirect.onclick = () => openVixDirect(currentActiveItem);

      btnModalExternal.onclick = async () => {
        const streamUrl = await resolveStream(currentActiveItem);
        if (streamUrl) {
          window.location.href = `vlc://${streamUrl}`;
          showToast("Invio a VLC / app esterna...");
        }
      };

      btnPlayerBack.onclick = () => {
        playerModal.classList.add('hidden');
        webVideo.pause();
        webVideo.src = '';
        webIframe.src = 'about:blank';
        if (currentHls) {
          currentHls.destroy();
          currentHls = null;
        }
      };

      // RANDOM TITLE FEATURE
      function pickRandomTitle() {
        if (!loadedCatalog || loadedCatalog.length === 0) {
          showToast("Caricamento catalogo in corso...");
          return;
        }
        const rand = loadedCatalog[Math.floor(Math.random() * loadedCatalog.length)];
        showToast(`🎲 Scelto per te: ${rand.name}`);
        openDetails(rand);
      }

      btnHeaderRandom.onclick = pickRandomTitle;
      navRandom.onclick = () => {
        setActiveNav(navRandom);
        pickRandomTitle();
      };

      // LIVE SEARCH ENGINE (TOUCH & DESKTOP COMPATIBLE)
      let searchTimeout = null;
      async function performSearch(query) {
        const q = (query || '').trim();
        if (!q) {
          gridSectionHeading.textContent = '🔥 Film & Serie TV in Evidenza';
          renderCards(loadedCatalog);
          return;
        }

        gridSectionHeading.textContent = `🔍 Risultati per: "${q}"`;
        try {
          const res = await fetch(`/api/sc/search?q=${encodeURIComponent(q)}`);
          const data = await res.json();
          if (data.success) {
            renderCards(data.titles || []);
          }
        } catch (e) {
          // Fallback to local filter
          const filtered = loadedCatalog.filter(t => t.name.toLowerCase().includes(q.toLowerCase()));
          renderCards(filtered);
        }
      }

      mainSearchInput.addEventListener('input', (e) => {
        const q = e.target.value;
        if (q.trim()) searchClearBtn.classList.remove('hidden');
        else searchClearBtn.classList.add('hidden');

        if (searchTimeout) clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => performSearch(q), 300);
      });

      mainSearchInput.addEventListener('search', () => {
        performSearch(mainSearchInput.value);
      });

      searchClearBtn.onclick = () => {
        mainSearchInput.value = '';
        searchClearBtn.classList.add('hidden');
        performSearch('');
      };

      // NAVBAR CONTROLS
      function setActiveNav(btn) {
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }

      btnBrandHome.onclick = () => {
        setActiveNav(navHome);
        mainSearchInput.value = '';
        searchClearBtn.classList.add('hidden');
        performSearch('');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      navHome.onclick = () => {
        setActiveNav(navHome);
        mainSearchInput.value = '';
        searchClearBtn.classList.add('hidden');
        performSearch('');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      navSearch.onclick = () => {
        setActiveNav(navSearch);
        mainSearchInput.focus();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      navSaved.onclick = () => {
        setActiveNav(navSaved);
        gridSectionHeading.textContent = '⭐ I tuoi Preferiti';
        if (savedFavorites.length === 0) {
          renderCards(loadedCatalog.slice(0, 4));
          showToast('Nessun preferito salvato: ecco i più popolari.');
        } else {
          renderCards(savedFavorites);
        }
      };

      // INITIALIZE
      loadHome();
    })();
  </script>
</body>
</html>
